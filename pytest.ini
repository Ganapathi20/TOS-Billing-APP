[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
addopts =
    --html=reports/report.html
    --self-contained-html
    -v
    --tb=short
markers =
    user_flow: marks tests belonging to the user device flow
    approver_flow: marks tests belonging to the approver device flow
    iteration1: Iteration 1 tests (UPI ID input)
    iteration2: Iteration 2 tests (QR upload)
